<style>

<body>
<div class="wrap">
  <h1 id="title">Погодити задачі</h1>
  <p class="sub" id="part"></p>
  <p class="rest" id="rest" hidden></p>
  <div class="cnt" id="cnt"></div>
  <div id="err"></div>
  <main>
    <section id="b-people"><h2>Людям <span class="hn" id="n-people"></span></h2><div id="list"></div></section>
    <section id="b-own"><h2>Ваші задачі <span class="hn" id="n-own"></span></h2><div id="list-own"></div></section>
    <section id="b-info"><h2>Не задачі — лише для повноти <span class="hn" id="n-info"></span></h2><div id="list-info"></div></section>
  </main>
  <div class="gen" id="genbox">
    <label for="gen">Зауваження до всього списку (Асистент запише до відома)</label>
    <textarea id="gen" maxlength="500" placeholder="Необов'язково"></textarea>
  </div>
  <div class="del" id="delbox" hidden>
    <button id="delbtn" type="button">Видалити нараду</button>
    <div id="delask" hidden>
      <p id="delq"></p>
      <div class="edacts"><button id="delyes" class="n" type="button">Так, видалити</button><button id="delno" type="button">Ні, лишити</button></div>
    </div>
  </div>
  <pre id="out"></pre>
  <footer><button id="send" type="button" disabled>Готово — надіслати</button></footer>
</div>

    // Перед sendData: рішення пішли — чернетку цього вікна (all — всього показу) прибрати; далі нічого не пишу. Сховище
    // ще не відповіло — прибере, щойно відповість (tryStore), і нічого з цього вікна вже не запише (рецензія безпеки, Д3).
    SENT = all ? 2 : 1;
    clearTimeout(FT);
    FT = null; DIRTY = []; rDirty = false;
    if (DRAFT) dropKeys(DRAFT, all);
    DRAFT = null;
  }
  function applyDraft(it, x) {
    if ('w' in x) it.w = typeof x.w === 'string' && (x.w === '' || team[x.w]) ? x.w : '';
    if ('d' in x) it.d = x.d === '-' || inRange(x.d) ? x.d : '';
    else if ('w' in x && it.f.indexOf('p') >= 0 && !mine(it.w)) it.d = '';   // строк асистента — лише її задачі (D208)
    if (typeof x.t === 'string') it.t = x.t.slice(0, it.ta ? it.ta.maxLength : 500);
    if (typeof x.z === 'string') it.z = x.z.slice(0, 200);
    if (x.c === 1 || x.c === 0) it.dec = x.c;
    if (it.dec === 1 && !complete(it)) it.dec = null;
    if (it.cal) it.cal.show(it.d);                     // календар — на місяць відновленого дня (render перефарбує)
    if (it.ta) it.ta.value = it.t;
    if (it.zz) it.zz.value = it.z;
    it.saved = true;
    render(it);
  }
  function restore(vals) {
    var y = 0, n = 0, e = 0, moved = [], hid = [], old = Date.now() - DDAYS * 864e5;
    items.forEach(function (it) {
      var x = parseDraft(vals[ikey(it.n)]);
      if (!x || it.touched || !(x.a > old)) return;
      if (x.f !== fp(it)) { moved.push(it.n); DRAFT.del([ikey(it.n)]); return; }
      if (x.s === 1) { hid.push(it.n); DRAFT.del([ikey(it.n)]); return; }   // було схоже на секрет — змісту не зберігала
      applyDraft(it, x);
      if (it.dec === 1) y++; else if (it.dec === 0) n++; else e++;
    });
    var r = parseDraft(vals[RKEY]), gr = '';
    if (r && typeof r.r === 'string' && r.a > old && !rTouched && !$('gen').value.trim()) {
      gr = r.r.slice(0, 500);
      $('gen').value = gr;
      rSaved = true;
    }
    var got = [];
    if (y) got.push('✓\u00a0' + y);
    if (n) got.push('✗\u00a0' + n);
    if (e) got.push('з\u00a0правками без рішення\u00a0' + e);
    if (gr) got.push('зауваження до списку');
    var line = got.length ? 'Ваші позначки з минулого відкриття збережено: ' + got.join(' · ') + '.' : '';
    if (moved.length) {
      line += (line ? ' ' : '') + (moved.length === 1 ? 'Пункт ' + moved[0] + ' змінився відтоді — позначте його ще раз.' :
        'Пункти ' + moved.join(', ') + ' змінились відтоді — позначте їх ще раз.');
    }
    if (hid.length) {
      line += (line ? ' ' : '') + (hid.length === 1 ? 'Пункт ' + hid[0] : 'Пункти ' + hid.join(', ')) + ' позначте ще раз: ' +
        'там було щось схоже на пароль чи код — таке не зберігається.';
    }
    if (line) { $('rest').textContent = line; $('rest').hidden = false; }
    count();
  }
  function opened(keys) {
    dkeys = keys.filter(function (k) { return typeof k === 'string' && OURS.test(k); });
    var mine = items.map(function (it) { return ikey(it.n); }).concat([RKEY]);
    var old = Date.now() - DDAYS * 864e5, other = dkeys.filter(function (k) { return mine.indexOf(k) < 0; });
    try {
      if (DRAFT.at) {
        DRAFT.del(other.filter(function (k) { return !(DRAFT.at(k) > old); }));
      } else {
        for (var i = 0; i < other.length; i += 20) {
          (function (b) {
            DRAFT.get(b, function (vals) {
              if (vals && DRAFT) DRAFT.del(b.filter(function (k) { var x = parseDraft(vals[k]); return !x || !(x.a > old); }));
            });
          })(other.slice(i, i + 20));
        }
      }
    } catch (e) {}
    var have = mine.filter(function (k) { return dkeys.indexOf(k) >= 0; });
    DRAFT.get(have, function (vals) {
      if (!DRAFT || SENT) return;
      try { restore(vals || {}); } catch (e) {}
      // Позначене, поки сховище відповідало, — у чернетку; стару чернетку такого пункту (вона її вже перепозначила чи
      // зняла) — прибрати, а не лишити до наступного відкриття (рецензія коду DISP-22, Д3).
      items.forEach(function (it) {
        if (!it.touched) return;
        it.saved = have.indexOf(ikey(it.n)) >= 0;
        if (DIRTY.indexOf(it) < 0) DIRTY.push(it);
      });
      if (rTouched) { rSaved = have.indexOf(RKEY) >= 0; rDirty = true; }
      flush();
    });
  }
  function tryStore(s, next) {
    // До DeviceStorage — лише коли CloudStorage відповів помилкою (чи його немає), а не коли він повільний: інакше
    // позначки розійшлися б по двох сховищах (рецензія коду DISP-22, В3). Пізня відповідь — приймається; поки сховище
    // мовчить, вікно працює без чернетки, позначене — запишу, щойно відповість.
    if (!s) return next();
    var over = false;
    try {
      s.list(function (keys) {
        if (over) return;
        over = true;
        if (!keys) return next();
        if (SENT) {                                   // «Готово» вже натиснуто — лише прибрати чернетку цього вікна
          dkeys = keys.filter(function (k) { return typeof k === 'string' && OURS.test(k); });
          return dropKeys(s, SENT === 2);
        }
        DRAFT = s;
        opened(keys);
      });
    } catch (e) {
      if (!over) { over = true; next(); }
    }
  }
  function startDraft() {
    // Ключ, якого не впізнає перелік (OURS), не прибирався б ніколи — тоді краще без чернетки (рецензія безпеки, Д4).
    if (!IN_TG || !TG.isVersionAtLeast || !OURS.test(ikey(9999)) || ikey(9999).length > 128 || !items.length) return;
    var cs = null;
    try { if (TG.isVersionAtLeast('6.9') && TG.CloudStorage) cs = cloudStore(TG.CloudStorage); } catch (e) {}
    tryStore(cs, function () {
      var ds = null;
      try { if (TG.isVersionAtLeast('9.0') && TG.DeviceStorage) ds = deviceStore(TG.DeviceStorage); } catch (e) {}
      tryStore(ds, function () {});
    });
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flushAll(); });
    window.addEventListener('pagehide', flushAll);
  }

  // Блоки: людям; її власні (Марго 06.10 — теж на погодження, окремо); не задачі (обговорення, повтори) — довідка.
  var people = items.filter(function (it) { return !it.own; }), own = items.filter(function (it) { return it.own; });
  people.forEach(function (it) { $('list').appendChild(render(it)); });
  own.forEach(function (it) { $('list-own').appendChild(render(it)); });
  info.forEach(function (x) {
    var b = el('div', 'info');
    b.appendChild(el('div', null, x[0] + '. ' + str(x[1], 200)));
    b.appendChild(el('div', 'note', str(x[2], 120)));
    $('list-info').appendChild(b);
  });
  $('n-people').textContent = people.length ? '(' + people.length + ')' : '';
  $('n-own').textContent = own.length ? '(' + own.length + ')' : '';
  $('n-info').textContent = info.length ? '(' + info.length + ')' : '';
  if (!people.length) $('b-people').style.display = 'none';
  if (!own.length) $('b-own').style.display = 'none';
  if (!info.length) $('b-info').style.display = 'none';
  count();
  startDraft();
  if (TG) {
    try { TG.ready(); TG.expand(); } catch (e) {}
  }
})();
</script>
